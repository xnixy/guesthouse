# Guest disks are reached through `guesthouse_hcs::guest_volume`: nothing here opens a path by its
# whole name. Files of the host's own say so with `#[allow(clippy::disallowed_methods)]`.
disallowed-methods = [
    { path = "std::fs::read", reason = "reach a guest's disk through guest_volume; allow it only for the host's own files" },
    { path = "std::fs::read_to_string", reason = "reach a guest's disk through guest_volume; allow it only for the host's own files" },
    { path = "std::fs::write", reason = "reach a guest's disk through guest_volume; allow it only for the host's own files" },
    { path = "std::fs::copy", reason = "reach a guest's disk through guest_volume; allow it only for the host's own files" },
    { path = "std::fs::rename", reason = "reach a guest's disk through guest_volume; allow it only for the host's own files" },
