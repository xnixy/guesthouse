[package]
name = "guesthouse-daemon"
description = "One process per VM: the sockets to QEMU, the shared memory, and the session between them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "guesthouse-daemon"
path = "src/main.rs"

[features]
# Answers messages with no GPU behind them, to try the sockets by hand. Never for a real guest.
stand-in = ["dep:guesthouse-backend-standin"]
# The real backend, which opens the host's GPU.
nvidia = ["dep:guesthouse-backend-nvidia", "dep:serde_json", "dep:guesthouse-sensors"]
# The AMD backend. With nvidia on as well, each run opens the card the app named for its guest.
amd = ["dep:guesthouse-backend-amd", "dep:serde_json"]
# The Intel backend, a first stage that runs nothing on the card and logs what the guest's driver
# sends. With another backend on as well, each run opens the card the app named, the same way.
intel = ["dep:guesthouse-backend-intel", "dep:serde_json"]

[dependencies]
guesthouse-backend.workspace = true
guesthouse-backend-amd = { workspace = true, optional = true }
guesthouse-backend-intel = { workspace = true, optional = true }
guesthouse-backend-nvidia = { workspace = true, optional = true }
guesthouse-backend-standin = { workspace = true, optional = true }
guesthouse-core.workspace = true
guesthouse-frame-socket.workspace = true
# The jail the daemon puts itself in once its setup is done.
guesthouse-jail.workspace = true
guesthouse-messages.workspace = true
guesthouse-transport.workspace = true
# mmap and ppoll, which the standard library does not offer.
libc = "0.2"
# The sensors' snapshot file, which the jail has to name.
guesthouse-sensors = { workspace = true, optional = true }
# The facade, for the logger in logger.rs to serve.
log = "0.4"
# The app writes what setup found as JSON, and this reads it.
serde_json = { version = "1", optional = true }

[dev-dependencies]
guesthouse-backend-standin.workspace = true
guesthouse-backend-nvidia = { workspace = true, features = ["fake-rm"] }

[lints]
workspace = true

# A jail can't be undone, so each case jails a child process of its own.
[[test]]
name = "jail"
harness = false
