[package]
name = "guesthouse-app-core"
description = "Everything the desktop app does that needs no display: machines, tasks, setup and the VM's start."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "guesthouse-task"
path = "src/bin/task.rs"

[[bin]]
name = "guesthouse-share"
path = "src/bin/share.rs"

[[bin]]
name = "guesthouse-check"
path = "src/bin/check.rs"

[[bin]]
name = "guesthouse-jail"
path = "src/bin/jail.rs"

[dependencies]
# The NVIDIA backend's driver profiles, so setup knows the daemon's branches. It opens nothing.
guesthouse-backend-nvidia.workspace = true
# Only for its slot names, so the app and the daemon can never disagree about what a VM owns.
guesthouse-daemon.workspace = true
# The jail QEMU runs in, which guesthouse-jail puts it in, and what this PC's kernel offers for one.
guesthouse-jail.workspace = true
# The host card's readings, which the daemon's sensor thread publishes and the overlay shows.
guesthouse-sensors.workspace = true
# Local time for the log and for snapshot dates. The standard library has no time zones.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Reading C headers for the tables a guest's modules are built with.
regex = "1"
# Safe calls for statvfs, flock, kill, access, getxattr and a send that never waits, which keeps `unsafe` out of this crate.
rustix = { version = "1", features = ["fs", "net", "process"] }
# Machine files, task files and QMP are all JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# ptrace, for a test that QEMU's jail refuses it.
libc = "0.2"

# A program under guesthouse-jail, which can't leave the jail, so each case is a process of its own.
[[test]]
name = "jail"
harness = false

# The whole flow of a VM with pretend programs, which needs a main of its own to be them.
[[test]]
name = "flow"
harness = false

[lints]
workspace = true
