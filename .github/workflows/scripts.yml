# Lints for the shell and PowerShell in the repo, the release notes script's tests, and the file size limit.
name: Scripts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scripts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every shell script
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      # Ubuntu's sh is dash, as Proxmox VE's is.
      - name: Proxmox's check, on made-up hosts
        run: bash tests/proxmox/run.sh
      - name: Proxmox's setup, on made-up printed scripts
        run: bash tests/proxmox/setup-vm.sh
      - name: The package page, against the docs
        run: bash tests/packages/page.sh
      - name: The repository signing, on stand-in tools
        run: bash tests/packages/publish-repo.sh
      - name: The Windows graphics driver's sources
        run: sh tests/windows-pvg/check-driver-sources.sh
      - name: Release notes, on a made-up repo
        run: python3 tests/release-notes/test.py
      - name: Credits, with odd titles
        run: python3 tests/release-credits/test.py

  file-size:
    name: File size
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: No source file past 1000 lines
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/check-file-size.sh "$BASE"

  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every PowerShell script
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $found = git ls-files '*.ps1' | ForEach-Object {
            Invoke-ScriptAnalyzer -Path $_ -Settings .github/PSScriptAnalyzerSettings.psd1
          }
          $found | Format-Table -AutoSize -Wrap | Out-String -Width 200 | Write-Host
          if ($found) { exit 1 }
